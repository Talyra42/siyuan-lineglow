name: Create Release on Tag Push

on:
  push:
    tags:
      - "v*"

# 仓库默认的 GITHUB_TOKEN 权限是只读，创建 Release 需要显式声明写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 仓库不跟踪 pnpm-lock.yaml，因此不使用 frozen-lockfile 与依赖缓存
      - name: Install dependencies
        # CI 环境默认开启 frozen-lockfile，而本仓库不提交 pnpm-lock.yaml，
        # 不显式关闭会直接以 ERR_PNPM_NO_LOCKFILE 失败
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # 这一步会生成 package.zip
      - name: Build for production
        run: pnpm build

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "package.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
